kind = "web"
previewPath = "/"
title = "ClientVerse"
version = "1.0.0"
id = "artifacts/clientverse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24718

[services.development]
run = "pnpm --filter @workspace/clientverse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clientverse", "run", "build" ]
publicDir = "artifacts/clientverse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24718"
BASE_PATH = "/"
